services:
  vite-app:
    build: .
    environment:
      - VITE_GREETING=From docker-compose.yml, injected by Docker Compose
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: pnpm dev --host # --host makes Vite listen on all network interfaces, allowing access from outside the container